id: no-secrets
title: Never add keys, tokens or passwords
severity: hard
status: active
applies_to: ['**']
exclude: ['*.example', '*.sample', '*.template']
check:
  kind: added-line-forbidden
  patterns:
    - 'sk-(?:ant-|proj-)?[A-Za-z0-9_-]{20,}'
    - '\bgh[pousr]_[A-Za-z0-9]{36,}\b'
    - '\bgithub_pat_[A-Za-z0-9_]{40,}\b'
    - '\bAKIA[0-9A-Z]{16}\b'
    - '\bAIza[0-9A-Za-z_-]{35}\b'
    - '\bxox[abprs]-[A-Za-z0-9-]{10,}'
    - '-----BEGIN (?:RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----'
    - '(?i)\b(?:api[_-]?key|secret|access[_-]?token|auth[_-]?token|password|passwd)\b["'']?\s*[:=]\s*["''][^"''\s$<{]{12,}["'']'
why: Committed secrets end up in git history, forks and backups; rotating them is painful.
fix: Read it from an environment variable or an untracked config file, and add that file to .gitignore.
source: { proposed_by: agent-guard starter set, approved_at: 2026-11-20 }
